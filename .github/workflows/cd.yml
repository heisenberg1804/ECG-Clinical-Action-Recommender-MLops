name: CD

# Deploy only after CI has passed on main. A push to main that fails CI is
# never deployed.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  # Manual "Run workflow" button: the first deploy after `make demo-up`
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # Never interrupt a rollout halfway

# Project-specific values come from repository variables, set from the
# foundation stack's outputs (see infra/README.md)
env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ecg-repo
  NAMESPACE: ecg-prod
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-deploy:
    # DEPLOY_ENABLED is a repository variable (Settings -> Secrets and variables ->
    # Actions -> Variables). Set it to true only while the platform stack is up.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Google Auth

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      # --- Keyless auth: GitHub OIDC token -> Workload Identity Federation ---
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: 'Configure Docker for Artifact Registry'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # --- Build & Push ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.api
          platforms: linux/amd64  # GKE nodes are amd64
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ env.REGISTRY }}/ecg-api:latest
            ${{ env.REGISTRY }}/ecg-api:${{ env.TAG }}

      - name: Build and push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.mlflow
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,mode=max,scope=mlflow
          tags: |
            ${{ env.REGISTRY }}/ecg-mlflow:latest
            ${{ env.REGISTRY }}/ecg-mlflow:${{ env.TAG }}

      # --- Roll out: same script as a manual deploy (manifests, secrets, images) ---
      - name: Deploy to GKE
        run: scripts/deploy_gke.sh "$PROJECT" "$TAG"

      # --- Verify the new pods actually serve predictions; roll back if not ---
      - name: Smoke test
        run: |
          kubectl port-forward -n "$NAMESPACE" deploy/ecg-api 8000:8000 >/dev/null 2>&1 &
          sleep 5
          curl -fsS http://localhost:8000/ready
          python3 -c "import json; print(json.dumps({'ecg_signal': [[0.0]*5000]*12}))" > /tmp/ecg.json
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d @/tmp/ecg.json > /dev/null
          kubectl port-forward -n "$NAMESPACE" svc/mlflow 5000:5000 >/dev/null 2>&1 &
          sleep 5
          curl -fsS http://localhost:5000/health
          echo "Smoke test passed"

      - name: Roll back on failure
        if: failure()
        run: |
          for d in ecg-api mlflow; do
            kubectl rollout undo "deployment/$d" -n "$NAMESPACE" || true
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=5m || true
          done
