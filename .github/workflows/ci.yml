name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Ruff
        run: uvx ruff@0.14.10 check src tests airflow infra

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # Tests load the real models/best_model.pth

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --frozen pytest --cov=src --cov-report=term-missing

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render kustomize overlays
        run: |
          # Prod reads DB credentials from a gitignored file; use the example to render
          cp k8s/overlays/prod/postgres.secret.env.example k8s/overlays/prod/postgres.secret.env
          for overlay in staging prod; do
            echo "::group::$overlay"
            kubectl kustomize "k8s/overlays/$overlay" > "/tmp/$overlay.yaml"
            echo "rendered $(grep -c '^kind:' /tmp/$overlay.yaml) resources"
            echo "::endgroup::"
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate stacks
        run: |
          for stack in foundation platform; do
            echo "::group::$stack"
            terraform -chdir="infra/terraform/$stack" init -backend=false -input=false
            terraform -chdir="infra/terraform/$stack" validate
            echo "::endgroup::"
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      # Build only (no push) so a broken Dockerfile fails here, not during deploy
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.api
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
