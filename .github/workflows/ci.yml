name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Ruff
        run: uvx ruff@0.14.10 check src tests airflow infra

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Tests load the real models/best_model.pth (LFS, below)

      # Git LFS bandwidth is metered: restore LFS objects from the Actions cache,
      # keyed on the exact set of LFS files, and download only on a cache miss
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-objects
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Materialize LFS files
        run: git lfs pull

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --frozen pytest --cov=src --cov-report=term-missing

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render kustomize base and prod overlay
        run: |
          for dir in base overlays/prod; do
            echo "::group::$dir"
            kubectl kustomize "k8s/$dir" > /tmp/rendered.yaml
            echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources"
            echo "::endgroup::"
          done

      - name: Prod overlay leaves only deploy-time placeholders
        run: |
          # deploy_gke.sh substitutes exactly these; anything else would ship literally
          kubectl kustomize k8s/overlays/prod | grep -o '\${[A-Z_]*}' | sort -u > /tmp/found
          printf '%s\n' '${API_IMAGE}' '${MLFLOW_IMAGE}' '${PROJECT_ID}' '${SQL_CONNECTION}' | sort > /tmp/expected
          diff /tmp/expected /tmp/found

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate stacks
        run: |
          for stack in foundation platform; do
            echo "::group::$stack"
            terraform -chdir="infra/terraform/$stack" init -backend=false -input=false
            terraform -chdir="infra/terraform/$stack" validate
            echo "::endgroup::"
          done

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, mlflow]
    steps:
      - uses: actions/checkout@v4

      # Git LFS bandwidth is metered: restore LFS objects from the Actions cache,
      # keyed on the exact set of LFS files, and download only on a cache miss
      - name: List LFS objects
        if: matrix.image == 'api'  # Only the API image contains the model
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-objects
      - name: Cache LFS objects
        if: matrix.image == 'api'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Materialize LFS files
        if: matrix.image == 'api'
        run: git lfs pull

      - uses: docker/setup-buildx-action@v3

      # Build only (no push) so a broken Dockerfile fails here, not during deploy
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
