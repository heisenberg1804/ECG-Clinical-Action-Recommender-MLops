# GKE overlay: Cloud SQL (via the Auth Proxy) instead of in-cluster Postgres,
# GCS instead of local volumes, Workload Identity on the service accounts.
#
# ${...} placeholders are filled in at deploy time by scripts/deploy_gke.sh,
# which discovers them with gcloud, so no project-specific values live in git.
# The ecg-db and mlflow-db Secrets are created by that script from Secret Manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecg-prod

resources:
  - ../../base

patches:
  - path: remove-local-stack.yaml
  - path: serviceaccounts.yaml
  - path: api.yaml
  - path: mlflow.yaml
  - path: service-patch.yaml
