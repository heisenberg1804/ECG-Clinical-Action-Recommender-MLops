# Workload Identity: these KSAs act as the Google service accounts created by
# infra/terraform/platform (roles: Cloud SQL client; MLflow also gets the bucket)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecg-api
  annotations:
    iam.gke.io/gcp-service-account: ecg-api-workload@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  annotations:
    iam.gke.io/gcp-service-account: mlflow-workload@${PROJECT_ID}.iam.gserviceaccount.com
