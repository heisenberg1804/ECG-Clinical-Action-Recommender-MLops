# MLflow tracking server + model registry.
# Backend store: Postgres (in-cluster here, Cloud SQL in prod).
# Artifacts: a local volume here, GCS in prod; proxied through the server
# (--serve-artifacts) so clients need no storage credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        fsGroup: 1000  # Image runs as uid 1000; lets it write the volume
      containers:
      - name: mlflow
        image: ecg-mlflow:local  # docker/Dockerfile.mlflow
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          value: mlflow
        - name: DB_USER
          valueFrom:
            secretKeyRef: {name: mlflow-db, key: username}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: mlflow-db, key: password}
        - name: ARTIFACTS_DESTINATION
          value: /mlflow/artifacts
        - name: MLFLOW_ALLOWED_HOSTS  # MLflow 3 rejects unknown Host headers
          value: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
        volumeMounts:
        - name: artifacts
          mountPath: /mlflow/artifacts
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 250m, memory: 512Mi}
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: http
