# MLflow tracking server + model registry.
# Backend store: Postgres (in-cluster here, Cloud SQL in prod).
# Artifacts: a local volume here, GCS in prod; proxied through the server
# (--serve-artifacts) so clients need no storage credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        fsGroup: 1000  # Image runs as uid 1000; lets it write the volume
      containers:
      - name: mlflow
        image: ecg-mlflow:local  # docker/Dockerfile.mlflow
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          value: mlflow
        - name: DB_USER
          valueFrom:
            secretKeyRef: {name: mlflow-db, key: username}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: mlflow-db, key: password}
        - name: ARTIFACTS_DESTINATION
          value: /mlflow/artifacts
        # MLflow 3 rejects unknown Host headers (fnmatch patterns; the port is
        # part of the match, so allow any port for port-forwards)
        - name: MLFLOW_ALLOWED_HOSTS
          value: "mlflow,mlflow:*,mlflow.*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
        # The server resolves models:/m-... URIs (model registration in MLflow 3)
        # with an internal client; without this it falls back to a local ./mlruns
        - name: MLFLOW_TRACKING_URI
          value: http://localhost:5000
        - name: MLFLOW_WORKERS  # One worker is ample for a team tracking server
          value: "1"
        # MLflow 3.17 starts a job runner and 7 huey consumers (~650 MiB) for GenAI
        # features (scorers, prompt optimization) this project doesn't use; with them
        # the pod was OOM-killed at 1 GiB
        - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
          value: "false"
        volumeMounts:
        - name: artifacts
          mountPath: /mlflow/artifacts
        startupProbe:  # Imports + DB migrations; allow up to 5 min
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        # Measured on minikube: ~460 MiB idle with 2 workers and OOM-killed at
        # 512 MiB while registering a model; at 250m CPU, half of startup was
        # throttled and readiness flapped for minutes. Idle CPU is ~6m.
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: 500m, memory: 1Gi}
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: http
