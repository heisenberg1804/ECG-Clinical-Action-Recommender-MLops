apiVersion: v1
kind: ConfigMap
metadata:
  name: ecg-api-config
  labels:
    app: ecg-api
data:
  # Model settings
  MODEL_PATH: "/app/models/best_model.pth"
  ACTION_MAPPING_PATH: "/app/src/ml/inference/action_mapping.json"
  
  # Prediction settings (threshold is a fallback; tuned per-class
  # thresholds ship with the model in models/model_meta.json)
  PREDICTION_THRESHOLD: "0.3"
  MAX_RECOMMENDATIONS: "5"