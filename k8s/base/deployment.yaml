apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecg-api
  labels:
    app: ecg-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecg-api
  template:
    metadata:
      labels:
        app: ecg-api
    spec:
      serviceAccountName: ecg-api
      containers:
      - name: api
        image: ecg-api:local  # Built into the local cluster by scripts/deploy-minikube.sh
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ecg_predictions
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ecg-db
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecg-db
              key: password
        - name: DISABLE_LLM_EXPLANATIONS
          value: "true"
        envFrom:
        - configMapRef:
            name: ecg-api-config
        # Tutor credentials and CHAT_ENABLED (D-71). Optional: without the Secret the
        # tutor is off and everything else runs as before
        - secretRef:
            name: tutor
            optional: true
        # Requests == limits: predictable on Autopilot, which bills by request
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 30  # Up to 150 s to load torch + the model
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
