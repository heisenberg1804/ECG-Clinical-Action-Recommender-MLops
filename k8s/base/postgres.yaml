# In-cluster Postgres for local clusters only (prod uses Cloud SQL).
# Credentials come from the ecg-db Secret, created by scripts/deploy-minikube.sh
# with a random password, so none are committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # The API creates its own tables on startup; MLflow just needs a database
  01-mlflow.sql: |
    CREATE DATABASE mlflow;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # One writer on a ReadWriteOnce volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: ecg_predictions
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: {name: ecg-db, key: username}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: ecg-db, key: password}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
          periodSeconds: 5
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 250m, memory: 512Mi}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
