# ============================================================
# FILE: pyproject.toml
# ============================================================
[project]
name = "ecg-recommender"
version = "0.1.0"
description = "Clinical action recommender from 12-lead ECG signals"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are what the serving API (and its image) needs; nothing else.
# Training, monitoring and dev tooling are dependency groups (D-67). Plain `uv sync`
# installs every group; the API image installs none (`--no-default-groups`).
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",  # resample_poly in shared preprocessing
    "torch>=2.1.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=8.0.0",  # 7.x crashes on FastAPI >= 0.143 routers
]

[dependency-groups]
training = [
    "pandas>=2.1.0,<3",  # pandas 3 (Arrow string dtype) breaks our code: planned migration (D-63)
    "wfdb>=4.1.0",
    "tqdm>=4.66.0",
    "mlflow>=2.9.0",
    "scikit-learn>=1.3.0",  # metrics.py
    "matplotlib>=3.8.0",  # reliability plots
]
monitoring = [
    "pandas>=2.1.0,<3",
    "evidently>=0.4.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",  # Required by FastAPI TestClient
    "ruff>=0.1.9",
]

[tool.uv]
default-groups = ["training", "monitoring", "dev"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# CPU-only torch wheels for Linux (CI + Docker image) to keep the image small.
# macOS uses the default PyPI wheels (CPU + MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
